<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030406" />
    <title>Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Escena 3D fija detrás de todo -->
    <canvas id="webgl" aria-hidden="true"></canvas>

    <!-- Pantalla negra con los ojos LED mientras baja el modelo -->
    <div id="loader" role="status" aria-live="polite">
      <div class="led-eyes" aria-hidden="true">
        <div class="led-eye"></div>
        <div class="led-eye"></div>
      </div>
      <p class="loader-pct"><span id="loader-pct">0</span>%</p>
    </div>

    <!-- Intro: el robot (en silueta) atrapa en el aire una gema por cada componente y la lleva a
         su sitio, donde el componente aparece. No es interactiva: al terminar, el robot la barre
         hacia un lado. Los componentes van juntos, centrados sobre el pecho del robot. -->
    <section id="hero" aria-label="Bienvenida">
      <div class="hero-stack">
        <div class="hero-part hero-icons" data-part="icons" aria-hidden="true">
          <span class="hero-icon">
            <svg viewBox="0 0 24 24"><path d="m18 16 4-4-4-4" /><path d="m6 8-4 4 4 4" /><path d="m14.5 4-5 16" /></svg>
          </span>
          <span class="hero-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          </span>
          <span class="hero-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
              />
              <path d="M9 18c-4.51 2-5-2-7-2" />
            </svg>
          </span>
        </div>

        <h1 class="hero-part hero-title" data-part="title">
          <span class="hero-kicker">Bienvenido a mi</span>
          <span class="hero-name">Portafolio Web</span>
        </h1>

        <p class="hero-part hero-url" data-part="url">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" />
          </svg>
          <span class="hero-url-text">www.tuportafolio.dev</span>
        </p>
      </div>
    </section>

    <main>
      <!-- Recorrido con scroll (prueba): el robot se ilumina, se ve entero y se acomoda a un lado -->
      <section id="intro" aria-label="Introducción">
        <p class="scroll-hint" aria-hidden="true">desliza</p>
      </section>

      <!-- Aquí irá el portafolio (nombre, proyectos, contacto) -->
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
